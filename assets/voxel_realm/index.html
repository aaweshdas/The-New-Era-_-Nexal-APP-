<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VOXEL REALM 3D - Open World Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050811; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 6px rgba(0, 229, 255, 0.8);
    }
    #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
    #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

    /* UI Overlay */
    #ui-hud {
      position: absolute; top: 16px; left: 16px; z-index: 20;
      background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(12px);
      padding: 12px 18px; border-radius: 16px; border: 1px solid rgba(0, 229, 255, 0.3);
      font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); pointer-events: none;
    }
    #ui-hud .title { color: #00E5FF; font-weight: 800; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    #ui-hud .title::before { content: '🧊'; font-size: 16px; }
    #ui-hud .stats { color: #a0aec0; font-size: 11px; margin-top: 4px; }

    /* Inventory Bar */
    #inventory {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; gap: 8px; background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(16px);
      padding: 8px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .slot {
      width: 46px; height: 46px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease; position: relative; font-size: 20px;
    }
    .slot.active {
      border-color: #00E5FF; background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.5); transform: scale(1.1);
    }
    .slot .num { position: absolute; top: 2px; left: 4px; font-size: 9px; color: rgba(255,255,255,0.6); font-weight: 800; }

    /* Instructions Modal */
    #click-to-play {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30;
      background: rgba(4, 7, 17, 0.88); backdrop-filter: blur(20px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center; padding: 20px;
    }
    #click-to-play h1 {
      font-size: 38px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(135deg, #00FF9D, #00E5FF, #A855F7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
    }
    #click-to-play p { color: #cbd5e1; font-size: 15px; max-width: 480px; line-height: 1.6; margin-bottom: 24px; }
    .btn-play {
      background: linear-gradient(135deg, #00E5FF, #A855F7); color: #000; font-size: 15px; font-weight: 800;
      padding: 14px 36px; border-radius: 30px; border: none; cursor: pointer; text-transform: uppercase;
      letter-spacing: 1.5px; box-shadow: 0 0 24px rgba(0, 229, 255, 0.5); transition: transform 0.2s;
    }
    .btn-play:hover { transform: scale(1.06); }
    .controls-hint { margin-top: 24px; display: flex; gap: 16px; font-size: 12px; color: #94a3b8; }
    .key-badge { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: monospace; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <div id="ui-hud">
    <div class="title">VOXEL REALM 3D</div>
    <div>FPS: <span id="fps-counter" style="color:#00FF9D;">60</span></div>
    <div class="stats">BLOCKS: <span id="block-count">0</span> | POS: <span id="pos-info">0, 0, 0</span></div>
  </div>

  <div id="inventory">
    <div class="slot active" data-type="grass"><span class="num">1</span>🌱</div>
    <div class="slot" data-type="dirt"><span class="num">2</span>🤎</div>
    <div class="slot" data-type="stone"><span class="num">3</span>🪨</div>
    <div class="slot" data-type="wood"><span class="num">4</span>🪵</div>
    <div class="slot" data-type="leaf"><span class="num">5</span>🍃</div>
    <div class="slot" data-type="brick"><span class="num">6</span>🧱</div>
    <div class="slot" data-type="gold"><span class="num">7</span>⭐</div>
    <div class="slot" data-type="glass"><span class="num">8</span>💎</div>
  </div>

  <div id="click-to-play">
    <h1>VOXEL REALM 3D</h1>
    <p>Explore an infinite procedural 3D voxel universe. Build, break, and shape your own world in real time.</p>
    <button class="btn-play">ENTER 3D REALM</button>
    <div class="controls-hint">
      <div><span class="key-badge">WASD</span> Move</div>
      <div><span class="key-badge">SPACE</span> Jump</div>
      <div><span class="key-badge">LEFT CLICK</span> Break</div>
      <div><span class="key-badge">RIGHT CLICK</span> Place</div>
      <div><span class="key-badge">1-8</span> Select Block</div>
    </div>
  </div>

  <script>
    // ── Three.js Voxel Sandbox Engine ─────────────────────────────────────────
    let container, scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let prevTime = performance.now();

    let blocks = new Map();
    let activeBlockType = 'grass';
    const BLOCK_SIZE = 1;
    const WORLD_SIZE = 16; // 32x32 terrain grid
    let isLocked = false;
    let yaw = 0, pitch = 0;

    // Texture Colors
    const blockColors = {
      grass: 0x4caf50,
      dirt: 0x795548,
      stone: 0x78909c,
      wood: 0x8d6e63,
      leaf: 0x2e7d32,
      brick: 0xd32f2f,
      gold: 0xffd54f,
      glass: 0x80deea
    };

    // Shared Geometries & Materials
    const boxGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
    const materials = {};
    Object.keys(blockColors).forEach(type => {
      materials[type] = new THREE.MeshStandardMaterial({
        color: blockColors[type],
        roughness: 0.6,
        metalness: type === 'gold' ? 0.8 : 0.1,
        transparent: type === 'glass',
        opacity: type === 'glass' ? 0.6 : 1.0
      });
    });

    const overlayStart = document.getElementById('click-to-play');
    const playBtn = document.querySelector('.btn-play');
    const fpsCounter = document.getElementById('fps-counter');
    const posInfo = document.getElementById('pos-info');
    const blockCountEl = document.getElementById('block-count');

    init();
    animate();

    function init() {
      container = document.getElementById('canvas-container');

      // Scene Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f24);
      scene.fog = new THREE.FogExp2(0x0a0f24, 0.025);

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const hemiLight = new THREE.HemisphereLight(0x00e5ff, 0x050811, 0.4);
      scene.add(hemiLight);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Generate Procedural Terrain
      generateWorld();

      // Controls Setup
      overlayStart.addEventListener('click', () => {
        overlayStart.style.display = 'none';
        container.requestPointerLock?.();
        isLocked = true;
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === container) {
          isLocked = true;
          overlayStart.style.display = 'none';
        } else {
          isLocked = false;
          overlayStart.style.display = 'flex';
        }
      });

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', onMouseDown);
      window.addEventListener('resize', onWindowResize);

      // Inventory Click
      document.querySelectorAll('.slot').forEach(slot => {
        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
          slot.classList.add('active');
          activeBlockType = slot.dataset.type;
        });
      });
    }

    function generateWorld() {
      const half = WORLD_SIZE / 2;
      for (let x = -half; x < half; x++) {
        for (let z = -half; z < half; z++) {
          // Perlin-like sine wave heightmap
          const height = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2) + 2;
          
          for (let y = 0; y <= height; y++) {
            let type = 'dirt';
            if (y === height) type = 'grass';
            else if (y < height - 2) type = 'stone';

            createBlock(x, y, z, type);
          }

          // Random Trees
          if (Math.random() < 0.03 && x > -half + 2 && x < half - 2 && z > -half + 2 && z < half - 2) {
            const trunkH = 4;
            for (let ty = 1; ty <= trunkH; ty++) {
              createBlock(x, height + ty, z, 'wood');
            }
            // Leaves canopy
            for (let lx = -1; lx <= 1; lx++) {
              for (let lz = -1; lz <= 1; lz++) {
                for (let ly = trunkH; ly <= trunkH + 2; ly++) {
                  if (!(lx === 0 && lz === 0 && ly === trunkH)) {
                    createBlock(x + lx, height + ly, z + lz, 'leaf');
                  }
                }
              }
            }
          }
        }
      }
      blockCountEl.textContent = blocks.size;
    }

    function createBlock(x, y, z, type) {
      const key = `${x},${y},${z}`;
      if (blocks.has(key)) return;

      const mesh = new THREE.Mesh(boxGeometry, materials[type] || materials.grass);
      mesh.position.set(x, y, z);
      mesh.userData = { x, y, z, type };
      scene.add(mesh);
      blocks.set(key, mesh);
    }

    function removeBlock(mesh) {
      if (!mesh) return;
      const key = `${mesh.userData.x},${mesh.userData.y},${mesh.userData.z}`;
      scene.remove(mesh);
      mesh.geometry.dispose();
      blocks.delete(key);
      blockCountEl.textContent = blocks.size;
    }

    function onMouseMove(e) {
      if (!isLocked) return;
      const movementX = e.movementX || 0;
      const movementY = e.movementY || 0;

      yaw -= movementX * 0.002;
      pitch -= movementY * 0.002;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

      const euler = new THREE.Euler(0, 0, 0, 'YXZ');
      euler.x = pitch;
      euler.y = yaw;
      camera.quaternion.setFromEuler(euler);
    }

    function onKeyDown(e) {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': moveForward = true; break;
        case 'KeyS': case 'ArrowDown': moveBackward = true; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
        case 'Space':
          if (camera.position.y <= 10) velocity.y += 6.5;
          break;
        case 'Digit1': selectSlot(0); break;
        case 'Digit2': selectSlot(1); break;
        case 'Digit3': selectSlot(2); break;
        case 'Digit4': selectSlot(3); break;
        case 'Digit5': selectSlot(4); break;
        case 'Digit6': selectSlot(5); break;
        case 'Digit7': selectSlot(6); break;
        case 'Digit8': selectSlot(7); break;
      }
    }

    function onKeyUp(e) {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': moveForward = false; break;
        case 'KeyS': case 'ArrowDown': moveBackward = false; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
      }
    }

    function selectSlot(idx) {
      const slots = document.querySelectorAll('.slot');
      if (slots[idx]) {
        slots.forEach(s => s.classList.remove('active'));
        slots[idx].classList.add('active');
        activeBlockType = slots[idx].dataset.type;
      }
    }

    function onMouseDown(e) {
      if (!isLocked) return;
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const intersects = raycaster.intersectObjects(Array.from(blocks.values()));
      if (intersects.length > 0) {
        const hit = intersects[0];
        if (e.button === 0) {
          // Left click: Break block
          removeBlock(hit.object);
        } else if (e.button === 2) {
          // Right click: Place block
          const norm = hit.face.normal;
          const px = hit.object.position.x + norm.x;
          const py = hit.object.position.y + norm.y;
          const pz = hit.object.position.z + norm.z;
          createBlock(px, py, pz, activeBlockType);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let frameCount = 0, lastFpsTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      // FPS Calculation
      frameCount++;
      if (time >= lastFpsTime + 1000) {
        fpsCounter.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = time;
      }

      // Physics & Movement
      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;
      velocity.y -= 18.0 * delta; // Gravity

      direction.z = Number(moveForward) - Number(moveBackward);
      direction.x = Number(moveRight) - Number(moveLeft);
      direction.normalize();

      if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
      if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;

      // Translate camera along view quaternion
      const moveVec = new THREE.Vector3(velocity.x * delta, 0, velocity.z * delta);
      moveVec.applyQuaternion(camera.quaternion);
      camera.position.x += moveVec.x;
      camera.position.z += moveVec.z;
      camera.position.y += velocity.y * delta;

      // Ground Collision floor
      if (camera.position.y < 2.5) {
        velocity.y = 0;
        camera.position.y = 2.5;
      }

      posInfo.textContent = `${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
